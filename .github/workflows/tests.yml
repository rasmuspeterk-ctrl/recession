name: tests

# Koerer v5's testsuite ved hvert push og hver PR. Ingen netvaerk: fetch-tests bruger mocks,
# og motor/finalize6/diagnostik-tests koerer mod det committede snapshot.
#
# Bemaerk (v5.0.1 §3.2a): test_frosne_vaegte_giver_ingen_reankrings_advarsel gaar ROED naar den
# aarlige september-rekalibrering er forfalden (foerste gang september 2027). Det er med vilje:
# CI'en er da paamindelsen — koer `python finalize6.py && python diagnostik.py` og commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy
      - name: Kompilering
        run: python -m py_compile v5/*.py debat/*.py
      - name: Testsuite (v5)
        working-directory: v5
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest -v test_v5
      - name: Legacy-replay (RAADETS_V501 §1.5a)
        working-directory: v5
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cp weights.json /tmp/weights.json.bak
          python finalize6.py --legacy
          cmp weights.json /tmp/weights.json.bak
